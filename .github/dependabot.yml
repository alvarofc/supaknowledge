version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      # The workspaces compile with TypeScript 7; the root `typescript` stays on 6.x because typescript-eslint
      # (Studio's lint) needs the TypeScript JS API, which 7.0 does not ship. Revisit with typescript-eslint's
      # TypeScript 7 support. See CONTRIBUTING.md.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /sdks/python
    schedule:
      interval: weekly
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]
