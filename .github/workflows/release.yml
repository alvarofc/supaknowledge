name: Release

# Publishes @supaknowledge/sdk, @supaknowledge/mastra and @supaknowledge/cli to npm (with provenance) and
# the `supaknowledge` Python package to PyPI (trusted publishing).
#
# Triggers: a pushed tag vX.Y.Z (must match the package versions), or a manual run from the Actions tab
# (dry run by default). Never runs on forks.
#
# Maintainer setup:
#   - npm: an organization/scope `supaknowledge`, and a repository secret NPM_TOKEN (granular automation token
#     with publish rights on @supaknowledge/*).
#   - PyPI: a trusted publisher for project `supaknowledge` pointing at this repository, workflow
#     `release.yml`, environment `pypi`; and a GitHub environment named `pypi` (optionally with required reviewers).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack everything, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify versions and run tests
    if: github.repository == 'alvarofc/supaknowledge'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Check versions (npm packages, SDK_VERSION, Python), tag and LICENSE/NOTICE copies
        id: version
        run: node scripts/check-release.mjs
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:shared
      - name: Packed npm tarballs ship LICENSE and NOTICE, and no source maps
        run: |
          npm run build -w @supaknowledge/sdk -w @supaknowledge/mastra -w @supaknowledge/cli
          for pkg in sdk mastra cli; do
            # --ignore-scripts: prepack's build output would corrupt the JSON (built just above)
            files=$(npm pack -w "packages/$pkg" --dry-run --json --ignore-scripts | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].files.map(f=>f.path).join("\n")))')
            for f in LICENSE NOTICE README.md; do
              echo "$files" | grep -qx "$f" || { echo "::error::packages/$pkg tarball is missing $f"; exit 1; }
            done
            if echo "$files" | grep -q '\.map$'; then echo "::error::packages/$pkg tarball ships source maps"; exit 1; fi
          done
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Python SDK tests
        working-directory: sdks/python
        run: |
          python -m pip install -e ".[test]"
          python -m pytest -q

  npm:
    name: Publish to npm
    needs: verify
    if: github.repository == 'alvarofc/supaknowledge'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # sdk first: mastra depends on it. Each package builds itself in `prepack`.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in sdk mastra cli; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            if [ "$DRY_RUN" = "true" ]; then
              npm publish -w "packages/$pkg" --dry-run
            elif npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published, skipping"
            else
              npm publish -w "packages/$pkg" --provenance --access public
            fi
          done

  pypi:
    name: Publish to PyPI
    needs: verify
    if: github.repository == 'alvarofc/supaknowledge'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
          for f in dist/*.whl; do python -m zipfile -l "$f" | grep -q 'licenses/NOTICE' || { echo "::error::wheel is missing NOTICE"; exit 1; }; done
          for f in dist/*.tar.gz; do tar -tzf "$f" | grep -q '/NOTICE$' || { echo "::error::sdist is missing NOTICE"; exit 1; }; done
      - name: Publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
          skip-existing: true
