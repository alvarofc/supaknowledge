name: Release

# Publishes @supaknowledge/sdk, @supaknowledge/mastra and @supaknowledge/cli to npm (with provenance) and
# the `supaknowledge` Python package to PyPI (trusted publishing).
#
# Triggers: a pushed tag vX.Y.Z (must match the package versions), or a manual run from the Actions tab
# (dry run by default). Never runs on forks.
#
# Maintainer setup:
#   - npm: an organization/scope `supaknowledge`, and a repository secret NPM_TOKEN (granular automation token
#     with publish rights on @supaknowledge/*).
#   - PyPI: a trusted publisher for project `supaknowledge` pointing at this repository, workflow
#     `release.yml`, environment `pypi`; and a GitHub environment named `pypi` (optionally with required reviewers).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack everything, but do not publish"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify versions and run tests
    if: github.repository == 'alvarofc/supaknowledge'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Read and check versions
        id: version
        run: |
          v_sdk=$(node -p "require('./packages/sdk/package.json').version")
          v_mastra=$(node -p "require('./packages/mastra/package.json').version")
          v_cli=$(node -p "require('./packages/cli/package.json').version")
          v_py=$(sed -n 's/^version = "\(.*\)"$/\1/p' sdks/python/pyproject.toml)
          echo "sdk=$v_sdk mastra=$v_mastra cli=$v_cli python=$v_py"
          if [ "$v_sdk" != "$v_mastra" ] || [ "$v_sdk" != "$v_cli" ] || [ "$v_sdk" != "$v_py" ]; then
            echo "::error::package versions differ"; exit 1
          fi
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v$v_sdk" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package version v$v_sdk"; exit 1
          fi
          echo "version=$v_sdk" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:shared

  npm:
    name: Publish to npm
    needs: verify
    if: github.repository == 'alvarofc/supaknowledge'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      # sdk first: mastra depends on it. Each package builds itself in `prepack`.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in sdk mastra cli; do
            name=$(node -p "require('./packages/$pkg/package.json').name")
            if [ "$DRY_RUN" = "true" ]; then
              npm publish -w "packages/$pkg" --dry-run
            elif npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name@$VERSION is already published, skipping"
            else
              npm publish -w "packages/$pkg" --provenance --access public
            fi
          done

  pypi:
    name: Publish to PyPI
    needs: verify
    if: github.repository == 'alvarofc/supaknowledge'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build sdist and wheel
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check dist/*
      - name: Publish
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdks/python/dist
          skip-existing: true
