name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Check [DESIGN.md §11 (open questions)](https://github.com/alvarofc/supaknowledge/blob/main/docs/DESIGN.md#11-open-questions)
        and existing issues first. Open-ended ideas fit well in Discussions.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work. Mention the parts it touches (Studio, CLI, SDKs, MCP, curator, schema...).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to work on this.
